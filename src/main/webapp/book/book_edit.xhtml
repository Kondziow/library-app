<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{bookEdit.id}" required="true"/>
        <f:viewAction action="#{bookEdit.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Create Book</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="title" value="#{bookEdit.book.title}" styleClass="form-control"/>
                            <h:outputLabel for="title" value="Title:" styleClass="form-label"/>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="releaseDate" value="#{bookEdit.book.releaseDate}"
                                         styleClass="form-control"/>
                            <h:outputLabel for="releaseDate" value="Release Date:" styleClass="form-label"/>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="genre" value="#{bookEdit.book.genre}"
                                         styleClass="form-control"/>
                            <h:outputLabel for="genre" value="Genre:" styleClass="form-label"/>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <fieldset>
                            <legend class="form-label fs-6">Author:</legend>
                            <ui:repeat value="#{bookEdit.authors}" var="author">
                                <div class="form-check">
                                    <h:selectOneRadio id="radioId" group="profesion"
                                                      value="#{bookEdit.book.author}"
                                                      styleClass="form-check-input"
                                                      enabledClass="form-check-label"
                                                      converter="authorModelConverter">
                                        <f:selectItem itemValue="#{author}" itemLabel="#{author.name}"/>
                                    </h:selectOneRadio>
                                </div>
                            </ui:repeat>
                        </fieldset>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-primary" value="Create"
                                         action="#{bookEdit.saveAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-secondary" type="reset" value="Reset"/>
                    </div>
                </div>
            </h:form>


        </article>
    </ui:define>

</ui:composition>
